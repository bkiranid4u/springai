spring:
  application:
    name: ai-demo
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            schema: classpath:schema/schema-h2db.sql
      client:
        enabled: false
    ollama:
      chat:
        options:
          model: llama3.2:1b
    openai:
      api-key: ${OPENAI_API_KEY:DummyKey}
  datasource:
    url: jdbc:h2:file:~/.h2/chatdb;AUTO_SERVER=true
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
logging:
  level:
    root: INFO
    "[org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor]": DEBUG
